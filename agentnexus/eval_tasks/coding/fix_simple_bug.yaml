id: "fix_simple_bug"
description: "修复一个简单的 Python bug：函数返回值类型不正确"
category: "coding"
difficulty: "easy"
eval_type: "capability"
tags: ["bug-fix", "python"]

input:
  prompt: |
    以下 Python 函数应该返回两个数的和，但返回了字符串。
    请修复这个 bug。

    ```python
    def add(a, b):
        return str(a + b)
    ```
  tools: ["code_executor"]

graders:
  - type: "code_execution"
    test_files:
      - "add(1, 2) == 3"
      - "add(-1, 1) == 0"
      - "isinstance(add(1, 2), int)"
    weight: 0.7
  - type: "llm_rubric"
    name: "code_quality"
    assertions:
      - "修复方案简洁正确"
      - "没有引入新问题"
    weight: 0.3

reference_solution: |
  def add(a, b):
      return a + b

timeout_sec: 60
