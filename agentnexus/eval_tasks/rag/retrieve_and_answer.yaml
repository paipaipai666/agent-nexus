id: "retrieve_and_answer"
description: "从知识库检索信息并回答问题"
category: "rag"
difficulty: "medium"
eval_type: "capability"
tags: ["rag", "retrieval", "knowledge"]

input:
  prompt: "什么是 RAG (Retrieval-Augmented Generation)？它的主要优势是什么？"
  tools: ["kb_search"]
  context:
    requires_kb: true

graders:
  - type: "tool_calls"
    required_tools:
      - tool: "kb_search"
    weight: 0.3
  - type: "llm_rubric"
    name: "accuracy"
    rubric: "评估回答的准确性和完整性"
    assertions:
      - "正确解释了 RAG 的概念"
      - "提到了检索增强生成的核心思想"
      - "列举了至少 2 个主要优势"
    weight: 0.5
  - type: "hallucination"
    threshold: 0.9
    weight: 0.2

timeout_sec: 90
