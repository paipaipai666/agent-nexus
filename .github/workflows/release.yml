name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"
      - name: Validate version tag matches pyproject.toml
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(python -c "import re; f=open('pyproject.toml',encoding='utf-8').read(); m=re.search(r'^version\s*=\s*\"(.+?)\"',f,re.MULTILINE); print(m.group(1) if m else 'NOTFOUND')")
          echo "Tag: $TAG_VERSION | pyproject.toml: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Version mismatch! Tag=$TAG_VERSION, pyproject.toml=$FILE_VERSION"
            exit 1
          fi
          echo "✓ Versions match: $TAG_VERSION"
      - name: Install deps
        run: pip install pyinstaller .
      - name: Build backend binary
        run: pyinstaller agentnexus.spec --noconfirm
      - name: List dist contents
        shell: bash
        run: ls -la dist/
      - name: Rename backend directory with platform suffix
        shell: bash
        run: |
          cd dist
          # Onedir build: dist/agentnexus/ contains the binary plus _internal/.
          if [ -d agentnexus ]; then
            if [ "${{ runner.os }}" = "Windows" ]; then
              mv agentnexus agentnexus-windows-x64
            elif [ "${{ runner.os }}" = "macOS" ]; then
              mv agentnexus agentnexus-macos-x64
            else
              mv agentnexus agentnexus-linux-x64
            fi
          fi
          ls -la
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: dist/agentnexus*

  build-desktop:
    needs: build-backend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: dist/
      - name: Make backend executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x dist/agentnexus-*/agentnexus
      - name: Verify backend binary
        shell: bash
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/
          echo "=== file type ==="
          file dist/agentnexus-*/agentnexus* || true
          echo "=== size ==="
          du -sh dist/agentnexus* || true
      - name: Stage backend directory for electron-builder
        shell: bash
        run: |
          # Onedir layout: electron-builder maps backend/agentnexus(.exe) and
          # backend/_internal/ into resources; electron main spawns
          # resources/backend/agentnexus(.exe), which finds _internal/ beside it.
          mkdir -p desktop/backend
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp -r dist/agentnexus-windows-x64/. desktop/backend/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp -r dist/agentnexus-macos-x64/. desktop/backend/
            chmod +x desktop/backend/agentnexus
          else
            cp -r dist/agentnexus-linux-x64/. desktop/backend/
            chmod +x desktop/backend/agentnexus
          fi
          echo "=== staged backend ==="
          ls -lh desktop/backend/
          file desktop/backend/agentnexus* || true
      - name: TypeScript compile
        working-directory: desktop
        run: npx tsc --noEmit
      - name: Vite build
        working-directory: desktop
        run: npx vite build
      - name: Electron-builder package (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npx electron-builder --linux --publish never
      - name: Electron-builder package (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npx electron-builder --win --publish never
      - name: Electron-builder package (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npx electron-builder --mac --publish never
      - name: Upload desktop artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/release/*.exe
      - name: Upload desktop artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/release/*.dmg
      - name: Upload desktop artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  smoke-test:
    needs: [build-backend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: dist/
      - name: Make executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x dist/agentnexus-*
      - name: Binary starts and shows version
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/agentnexus-windows-x64/agentnexus.exe version
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ./dist/agentnexus-macos-x64/agentnexus version
          else
            ./dist/agentnexus-linux-x64/agentnexus version
          fi

  release:
    needs: [build-backend, build-desktop, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: List release files
        run: find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name 'agentnexus*' \) ! -path '*/node_modules/*' | sort
      - name: Generate SHA256 checksums
        run: |
          cd backend-ubuntu-latest || true
          cd ..
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name 'agentnexus*' \) \
            ! -path '*/node_modules/*' ! -name 'SHA256SUMS.txt' \
            -exec sha256sum {} \; > SHA256SUMS.txt
          echo "=== Checksums ==="
          cat SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend-*/*
            desktop-*/*
            SHA256SUMS.txt
          generate_release_notes: true
