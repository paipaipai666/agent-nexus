name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyinstaller .
      - name: Build backend binary
        run: pyinstaller agentnexus.spec --noconfirm
      - name: List dist contents
        shell: bash
        run: ls -la dist/
      - name: Rename backend binary with platform suffix
        shell: bash
        run: |
          cd dist
          if [ -f agentnexus.exe ]; then
            mv agentnexus.exe agentnexus-windows-x64.exe
          fi
          if [ -f agentnexus ]; then
            if [ "${{ runner.os }}" = "macOS" ]; then
              mv agentnexus agentnexus-macos-x64
            else
              mv agentnexus agentnexus-linux-x64
            fi
          fi
          ls -la
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: dist/agentnexus*

  build-desktop:
    needs: build-backend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: dist/
      - name: Make backend executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x dist/agentnexus-*
      - name: Verify backend binary
        shell: bash
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/
          echo "=== file type ==="
          file dist/agentnexus* || true
          echo "=== size ==="
          du -sh dist/agentnexus* || true
      - name: Stage backend binary for electron-builder
        shell: bash
        run: |
          mkdir -p desktop/backend
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/agentnexus-windows-x64.exe desktop/backend/agentnexus.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp dist/agentnexus-macos-x64 desktop/backend/agentnexus
            chmod +x desktop/backend/agentnexus
          else
            cp dist/agentnexus-linux-x64 desktop/backend/agentnexus
            chmod +x desktop/backend/agentnexus
          fi
          echo "=== staged backend ==="
          ls -lh desktop/backend/
          file desktop/backend/*
      - name: TypeScript compile
        working-directory: desktop
        run: npx tsc --noEmit
      - name: Vite build
        working-directory: desktop
        run: npx vite build
      - name: Electron-builder package (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npx electron-builder --linux --publish never
      - name: Electron-builder package (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npx electron-builder --win --publish never
      - name: Electron-builder package (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npx electron-builder --mac --publish never
      - name: Upload desktop artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/release/*.exe
      - name: Upload desktop artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/release/*.dmg
      - name: Upload desktop artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  smoke-test:
    needs: [build-backend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: dist/
      - name: Make executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x dist/agentnexus-*
      - name: Binary starts and shows version
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/agentnexus-windows-x64.exe --version
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ./dist/agentnexus-macos-x64 --version
          else
            ./dist/agentnexus-linux-x64 --version
          fi

  release:
    needs: [build-backend, build-desktop, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: List release files
        run: find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name 'agentnexus*' \) ! -path '*/node_modules/*' | sort
      - name: Generate SHA256 checksums
        run: |
          cd backend-ubuntu-latest || true
          cd ..
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name 'agentnexus*' \) \
            ! -path '*/node_modules/*' ! -name 'SHA256SUMS.txt' \
            -exec sha256sum {} \; > SHA256SUMS.txt
          echo "=== Checksums ==="
          cat SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend-*/*
            desktop-*/*
            SHA256SUMS.txt
          generate_release_notes: true
