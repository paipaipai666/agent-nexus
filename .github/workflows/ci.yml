name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check .

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev,rag,server,tui]"
      - name: Check for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --strict --desc

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev,rag,server,tui]"
      - name: Run unit and integration tests
        run: python -m pytest tests/unit/ tests/integration/ tests/security/ -q --tb=short --timeout=60
      - name: Run coverage (ubuntu + 3.11 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m pytest tests/unit/ --cov=agentnexus --cov-report=xml --cov-report=term-missing -q --tb=short --timeout=60
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  eval-gate:
    name: Eval Gate
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev,rag,server,tui]"
      - name: Validate eval dataset
        run: |
          python -c "
          from agentnexus.evaluation.dataset import EvalDataset
          ds = EvalDataset()
          errors = ds.validate()
          stats = ds.stats()
          print(f'Tasks: {stats}')
          if errors:
            for e in errors:
              print(f'  ERROR: {e}')
            exit(1)
          print('Dataset valid')
          "
      - name: Run eval CI gate (agent quality)
        run: python -m agentnexus eval ci -d 1
