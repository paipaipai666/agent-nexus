appId: com.agentnexus.desktop
productName: AgentNexus
directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*

extraResources:
  - from: "backend/"
    to: "backend"

win:
  target:
    - target: nsis
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - AppImage
    - deb
  category: Utility

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
