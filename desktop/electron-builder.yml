appId: com.agentnexus.desktop
productName: AgentNexus
directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  extraResources:
    - from: "backend/agentnexus.exe"
      to: "backend/agentnexus.exe"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  extraResources:
    - from: "backend/agentnexus"
      to: "backend/agentnexus"

linux:
  target:
    - AppImage
    - deb
  category: Utility
  extraResources:
    - from: "backend/agentnexus"
      to: "backend/agentnexus"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
