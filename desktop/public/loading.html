<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentNexus</title>
  <link rel="icon" type="image/png" href="./agentnexus-mark.png">
  <link rel="stylesheet" href="./startup.css">
</head>
<body>
  <main class="startup-screen" aria-label="Starting AgentNexus">
    <div class="startup-brand">
      <img class="startup-mark" src="./agentnexus-mark.png" width="72" height="72" alt="AgentNexus logo">
      <h1 class="startup-title">AgentNexus</h1>
    </div>
    <div class="startup-spinner" id="spinner" aria-hidden="true"></div>
    <p class="startup-status" id="status" role="status">Starting backend...</p>
    <p class="startup-error" id="error" role="alert" hidden></p>
    <button class="startup-close" id="close" type="button" aria-label="Close AgentNexus" hidden>×</button>
  </main>
  <script>
    if (window.electronAPI) {
      const closeButton = document.getElementById('close')
      closeButton.hidden = false
      closeButton.addEventListener('click', () => window.electronAPI.close())
      const unsubscribe = window.electronAPI.onBackendError((message) => {
        document.getElementById('spinner').hidden = true
        document.getElementById('status').textContent = 'Unable to start AgentNexus'
        const error = document.getElementById('error')
        error.textContent = message
        error.hidden = false
      })
      window.addEventListener('pagehide', unsubscribe, { once: true })
    }
  </script>
</body>
</html>
